<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
/>

<title>Create Account • AMG Data Hub</title>

<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
/>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  min-height:100vh;

  background:#000b2c;

  font-family:Arial, sans-serif;

  overflow-x:hidden;

  padding:20px;
}

/* CONTAINER */

.container{
  position:relative;
  z-index:1;
  max-width:430px;
  margin:auto;
  padding-top:20px;
}

/* LOGO */

.logo-section{
  text-align:center;
  margin-bottom:25px;
}

.logo{
  width:95px;
  margin-bottom:12px;
}

.brand{
  color:white;
  font-size:28px;
  font-weight:bold;
}

.brand span{
  color:#facc15;
}

.tagline{
  color:#cbd5e1;
  margin-top:8px;
  font-size:15px;
}

/* CARD */

.signup-card{

  background:rgba(255,255,255,0.04);

  backdrop-filter:blur(18px);

  border:1px solid rgba(255,255,255,0.08);

  border-radius:35px;

  padding:30px 22px;

  box-shadow:
  0 10px 40px rgba(0,0,0,0.35);
}

/* TITLE */

.signup-card h1{
  color:white;
  font-size:30px;
  margin-bottom:10px;
}

.sub{
  color:#cbd5e1;
  margin-bottom:28px;
  line-height:1.5;
}

/* GOOGLE BUTTON */

.google-btn{
  width:100%;
  padding:17px;
  border:none;
  border-radius:18px;
  background:white;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;

  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;

  transition:0.3s;
}

.google-btn:hover{
  transform:translateY(-2px);
}

.google-btn i{
  color:#ea4335;
  font-size:22px;
}

/* DIVIDER */

.divider{
  display:flex;
  align-items:center;
  gap:12px;
  margin:25px 0;
}

.divider hr{
  flex:1;
  border:none;
  height:1px;
  background:rgba(255,255,255,0.1);
}

.divider span{
  color:#cbd5e1;
}

/* INPUTS */

.input-group{
  position:relative;
  margin-bottom:18px;
}

.input-group i{
  position:absolute;
  left:18px;
  top:50%;
  transform:translateY(-50%);
  color:#94a3b8;
  font-size:18px;
}

.input-group input{
  width:100%;
  padding:18px 18px 18px 52px;

  border-radius:18px;

  border:1px solid rgba(255,255,255,0.1);

  background:rgba(255,255,255,0.05);

  color:white;

  font-size:16px;

  outline:none;

  transition:0.3s;
}

.input-group input:focus{

  border-color:#facc15;

  box-shadow:
  0 0 0 4px rgba(250,204,21,0.15);

}

.input-group input::placeholder{
  color:#94a3b8;
}

.eye{
  position:absolute;
  right:18px;
  top:50%;
  transform:translateY(-50%);
  color:#94a3b8;
  cursor:pointer;
}

/* BUTTON */

.signup-btn{
  width:100%;
  padding:18px;
  border:none;
  border-radius:18px;

  background:#facc15;

  color:#111827;

  font-size:20px;
  font-weight:bold;

  cursor:pointer;

  margin-top:10px;

  transition:0.3s;
}

.signup-btn:hover{
  transform:translateY(-2px);

  box-shadow:
  0 10px 25px rgba(250,204,21,0.35);
}

/* LOGIN */

.login-link{
  text-align:center;
  margin-top:28px;
  color:#cbd5e1;
}

.login-link a{
  color:#facc15;
  font-weight:bold;
  text-decoration:none;
}

/* FLOATING BUTTONS */

.whatsapp,
.chat{
  position:fixed;

  width:55px;
  height:55px;

  border-radius:50%;

  display:flex;
  justify-content:center;
  align-items:center;

  text-decoration:none;

  font-size:24px;

  z-index:100;
}

.whatsapp{
  left:15px;
  bottom:18px;

  background:#25d366;
  color:white;

  box-shadow:
  0 0 25px rgba(37,211,102,0.45);
}

.chat{
  right:15px;
  bottom:18px;

  background:#6d28d9;
  color:white;
}

/* FOOTER */

.footer{
  text-align:center;
  margin-top:25px;
  color:#94a3b8;
  font-size:14px;
}

/* MOBILE */

@media(max-width:500px){

  .signup-card{
    padding:28px 18px;
  }

  .signup-card h1{
    font-size:26px;
  }

}

</style>

</head>

<body>

<div class="container">

  <!-- LOGO -->

  <div class="logo-section">

    <img
      src="logo.png"
      class="logo"
      alt="AMG Logo"
    >

    <div class="brand">
      AMG <span>DATA HUB</span>
    </div>

    <div class="tagline">
      Secure • Fast • Reliable
    </div>

  </div>

  <!-- CARD -->

  <div class="signup-card">

    <h1>Create Account</h1>

    <p class="sub">
      Join thousands of resellers and
      start buying affordable data bundles.
    </p>

    <!-- GOOGLE -->

    <button class="google-btn">

      <i class="fa-brands fa-google"></i>

      Continue with Google

    </button>

    <!-- DIVIDER -->

    <div class="divider">

      <hr>

      <span>or</span>

      <hr>

    </div>

    <!-- FULLNAME -->

    <div class="input-group">

      <i class="fa-regular fa-user"></i>

      <input
        type="text"
        placeholder="Full Name"
      >

    </div>

    <!-- EMAIL -->

    <div class="input-group">

      <i class="fa-regular fa-envelope"></i>

      <input
        type="email"
        placeholder="Email Address"
      >

    </div>

    <!-- PHONE -->

    <div class="input-group">

      <i class="fa-solid fa-phone"></i>

      <input
        type="tel"
        placeholder="Phone Number"
      >

    </div>

    <!-- PASSWORD -->

    <div class="input-group">

      <i class="fa-solid fa-lock"></i>

      <input
        id="password"
        type="password"
        placeholder="Password"
      >

      <span
        class="eye"
        onclick="togglePassword('password')"
      >
        <i class="fa-regular fa-eye"></i>
      </span>

    </div>

    <!-- CONFIRM PASSWORD -->

    <div class="input-group">

      <i class="fa-solid fa-lock"></i>

      <input
        id="confirmPassword"
        type="password"
        placeholder="Confirm Password"
      >

      <span
        class="eye"
        onclick="togglePassword('confirmPassword')"
      >
        <i class="fa-regular fa-eye"></i>
      </span>

    </div>

    <!-- REFERRAL -->

    <div class="input-group">

      <i class="fa-solid fa-gift"></i>

      <input
        type="text"
        placeholder="Referral Code (Optional)"
      >

    </div>

    <!-- BUTTON -->

    <button class="signup-btn">
      Create Account →
    </button>

    <!-- LOGIN -->

    <div class="login-link">

      Already have an account?

      <a href="index.html">
        Sign In
      </a>

    </div>

  </div>

  <!-- FOOTER -->

  <div class="footer">
    © 2026 AMG Data Hub
  </div>

</div>

<!-- WHATSAPP -->

<a
  href="https://wa.me/233241895999"
  class="whatsapp"
>
  <i class="fa-brands fa-whatsapp"></i>
</a>

<!-- CHAT -->

<a
  href="#"
  class="chat"
>
  <i class="fa-regular fa-comment"></i>
</a>

<script>

function togglePassword(id){

  const input =
    document.getElementById(id);

  if(input.type === "password"){

    input.type = "text";

  }else{

    input.type = "password";

  }

}

</script>

</body>
</html>
