<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
/>

<title>Create Account • AMG Data Hub</title>

<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
/>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  min-height:100vh;
  background:#000b2c;
  font-family:Arial, sans-serif;
  overflow-x:hidden;
  padding:16px;
}

/* CONTAINER */

.container{
  position:relative;
  max-width:400px;
  margin:auto;
  padding-top:10px;
}

/* LOGO */

.logo-section{
  text-align:center;
  margin-bottom:18px;
}

.logo{
  width:80px;
  margin-bottom:8px;
}

.brand{
  color:white;
  font-size:24px;
  font-weight:bold;
}

.brand span{
  color:#facc15;
}

.tagline{
  color:#cbd5e1;
  margin-top:5px;
  font-size:13px;
}

/* CARD */

.signup-card{

  background:rgba(255,255,255,0.04);

  backdrop-filter:blur(15px);

  border:1px solid rgba(255,255,255,0.08);

  border-radius:28px;

  padding:22px 18px;

  box-shadow:
  0 8px 30px rgba(0,0,0,0.35);
}

/* TITLE */

.signup-card h1{
  color:white;
  font-size:24px;
  margin-bottom:8px;
}

.sub{
  color:#cbd5e1;
  margin-bottom:20px;
  line-height:1.4;
  font-size:14px;
}

/* GOOGLE BUTTON */

.google-btn{
  width:100%;
  padding:14px;
  border:none;
  border-radius:15px;
  background:white;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;

  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;

  transition:0.3s;
}

.google-btn:hover{
  transform:translateY(-2px);
}

.google-btn i{
  color:#ea4335;
  font-size:20px;
}

/* DIVIDER */

.divider{
  display:flex;
  align-items:center;
  gap:10px;
  margin:18px 0;
}

.divider hr{
  flex:1;
  border:none;
  height:1px;
  background:rgba(255,255,255,0.1);
}

.divider span{
  color:#cbd5e1;
  font-size:13px;
}

/* INPUTS */

.input-group{
  position:relative;
  margin-bottom:14px;
}

.input-group i{
  position:absolute;
  left:15px;
  top:50%;
  transform:translateY(-50%);
  color:#94a3b8;
  font-size:16px;
}

.input-group input{
  width:100%;
  padding:15px 15px 15px 45px;

  border-radius:15px;

  border:1px solid rgba(255,255,255,0.1);

  background:rgba(255,255,255,0.05);

  color:white;

  font-size:14px;

  outline:none;

  transition:0.3s;
}

.input-group input:focus{

  border-color:#facc15;

  box-shadow:
  0 0 0 4px rgba(250,204,21,0.12);

}

.input-group input::placeholder{
  color:#94a3b8;
}

.eye{
  position:absolute;
  right:15px;
  top:50%;
  transform:translateY(-50%);
  color:#94a3b8;
  cursor:pointer;
  font-size:15px;
}

/* BUTTON */

.signup-btn{
  width:100%;
  padding:15px;
  border:none;
  border-radius:15px;

  background:#facc15;

  color:#111827;

  font-size:18px;
  font-weight:bold;

  cursor:pointer;

  margin-top:6px;

  transition:0.3s;
}

.signup-btn:hover{
  transform:translateY(-2px);

  box-shadow:
  0 10px 20px rgba(250,204,21,0.30);
}

/* LOGIN */

.login-link{
  text-align:center;
  margin-top:20px;
  color:#cbd5e1;
  font-size:14px;
}

.login-link a{
  color:#facc15;
  font-weight:bold;
  text-decoration:none;
}

/* WHATSAPP */

.whatsapp{

  position:fixed;

  left:12px;
  bottom:16px;

  width:54px;
  height:54px;

  border-radius:50%;

  background:#25d366;

  color:white;

  display:flex;
  justify-content:center;
  align-items:center;

  text-decoration:none;

  font-size:26px;

  z-index:9999;

  cursor:grab;

  box-shadow:
  0 0 22px rgba(37,211,102,0.45);

  transition:0.2s;
}

.whatsapp:active{
  cursor:grabbing;
}

/* FOOTER */

.footer{
  text-align:center;
  margin-top:20px;
  color:#94a3b8;
  font-size:13px;
}

/* MOBILE */

@media(max-width:500px){

  .container{
    max-width:100%;
  }

}

</style>

</head>

<body>

<div class="container">

  <!-- LOGO -->

  <div class="logo-section">

    <img
      src="logo.png"
      class="logo"
      alt="AMG Logo"
    >

    <div class="brand">
      AMG <span>DATA HUB</span>
    </div>

    <div class="tagline">
      Secure • Fast • Reliable
    </div>

  </div>

  <!-- CARD -->

  <div class="signup-card">

    <h1>Create Account</h1>

    <p class="sub">
      Join thousands of resellers and start
      buying affordable data bundles.
    </p>

    <!-- GOOGLE -->

    <button class="google-btn">

      <i class="fa-brands fa-google"></i>

      Continue with Google

    </button>

    <!-- DIVIDER -->

    <div class="divider">

      <hr>

      <span>or</span>

      <hr>

    </div>

    <!-- FULLNAME -->

    <div class="input-group">

      <i class="fa-regular fa-user"></i>

      <input
        type="text"
        placeholder="Full Name"
      >

    </div>

    <!-- EMAIL -->

    <div class="input-group">

      <i class="fa-regular fa-envelope"></i>

      <input
        type="email"
        placeholder="Email Address"
      >

    </div>

    <!-- PHONE -->

    <div class="input-group">

      <i class="fa-solid fa-phone"></i>

      <input
        type="tel"
        placeholder="Phone Number"
      >

    </div>

    <!-- PASSWORD -->

    <div class="input-group">

      <i class="fa-solid fa-lock"></i>

      <input
        id="password"
        type="password"
        placeholder="Password"
      >

      <span
        class="eye"
        onclick="togglePassword('password')"
      >
        <i class="fa-regular fa-eye"></i>
      </span>

    </div>

    <!-- CONFIRM PASSWORD -->

    <div class="input-group">

      <i class="fa-solid fa-lock"></i>

      <input
        id="confirmPassword"
        type="password"
        placeholder="Confirm Password"
      >

      <span
        class="eye"
        onclick="togglePassword('confirmPassword')"
      >
        <i class="fa-regular fa-eye"></i>
      </span>

    </div>

    <!-- REFERRAL -->

    <div class="input-group">

      <i class="fa-solid fa-gift"></i>

      <input
        type="text"
        placeholder="Referral Code (Optional)"
      >

    </div>

    <!-- BUTTON -->

    <button class="signup-btn">
      Create Account →
    </button>

    <!-- LOGIN -->

    <div class="login-link">

      Already have an account?

      <a href="index.html">
        Sign In
      </a>

    </div>

  </div>

  <!-- FOOTER -->

  <div class="footer">
    © 2026 AMG Data Hub
  </div>

</div>

<!-- WHATSAPP -->

<a
  href="https://wa.me/233241895999"
  class="whatsapp"
  id="dragWhatsapp"
>
  <i class="fa-brands fa-whatsapp"></i>
</a>

<script>

/* TOGGLE PASSWORD */

function togglePassword(id){

  const input =
    document.getElementById(id);

  if(input.type === "password"){

    input.type = "text";

  }else{

    input.type = "password";

  }

}

/* DRAG WHATSAPP */

const dragItem =
document.getElementById("dragWhatsapp");

let active = false;

let currentX;
let currentY;

let initialX;
let initialY;

dragItem.addEventListener(
  "touchstart",
  dragStart,
  false
);

dragItem.addEventListener(
  "touchmove",
  drag,
  false
);

dragItem.addEventListener(
  "touchend",
  dragEnd,
  false
);

function dragStart(e){

  initialX =
    e.touches[0].clientX -
    dragItem.offsetLeft;

  initialY =
    e.touches[0].clientY -
    dragItem.offsetTop;

  active = true;
}

function drag(e){

  if(active){

    e.preventDefault();

    currentX =
      e.touches[0].clientX -
      initialX;

    currentY =
      e.touches[0].clientY -
      initialY;

    dragItem.style.left =
      currentX + "px";

    dragItem.style.top =
      currentY + "px";

    dragItem.style.bottom =
      "auto";
  }

}

function dragEnd(){

  active = false;
}

</script>

</body>
</html>
