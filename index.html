<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
/>

<title>AMG Data Hub</title>

<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
/>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#000b2c;
  font-family:Arial, sans-serif;
  color:white;
  min-height:100vh;
  padding:16px;
  overflow-x:hidden;
}

/* CONTAINER */

.container{
  max-width:400px;
  margin:auto;
  padding-top:10px;
}

/* LOGO */

.logo-section{
  text-align:center;
  margin-bottom:18px;
}

.logo{
  width:80px;
  margin-bottom:8px;
}

.brand{
  color:white;
  font-size:24px;
  font-weight:bold;
}

.brand span{
  color:#facc15;
}

.tagline{
  color:#cbd5e1;
  margin-top:5px;
  font-size:13px;
}

/* SKIP CARD */

.skip-card{

  background:rgba(255,255,255,0.04);

  border:1px solid rgba(255,255,255,0.08);

  border-radius:24px;

  padding:18px;

  margin-bottom:18px;

  display:flex;
  justify-content:space-between;
  align-items:center;

  backdrop-filter:blur(12px);

  cursor:pointer;

  transition:0.3s;
}

.skip-card:hover{
  transform:translateY(-2px);
}

.skip-left h2{
  font-size:18px;
  margin-bottom:5px;
}

.skip-left p{
  color:#cbd5e1;
  font-size:13px;
  line-height:1.4;
}

.skip-arrow{

  width:45px;
  height:45px;

  border-radius:14px;

  background:#facc15;

  color:#111827;

  display:flex;
  justify-content:center;
  align-items:center;

  font-size:22px;
  font-weight:bold;
}

/* LOGIN CARD */

.login-card{

  background:rgba(255,255,255,0.04);

  border:1px solid rgba(255,255,255,0.08);

  border-radius:28px;

  padding:22px 18px;

  backdrop-filter:blur(15px);

  box-shadow:
  0 8px 30px rgba(0,0,0,0.35);
}

.login-card h1{
  font-size:24px;
  margin-bottom:8px;
}

.login-card .sub{
  color:#cbd5e1;
  margin-bottom:22px;
  font-size:14px;
  line-height:1.5;
}

/* INPUTS */

.input-box{
  position:relative;
  margin-bottom:15px;
}

.input-icon{
  position:absolute;
  left:15px;
  top:50%;
  transform:translateY(-50%);
  color:#94a3b8;
  font-size:16px;
}

.input-box input{
  width:100%;
  padding:15px 48px 15px 45px;

  border-radius:15px;

  border:1px solid rgba(255,255,255,0.1);

  background:rgba(255,255,255,0.05);

  color:white;

  font-size:14px;

  outline:none;

  transition:0.3s;
}

.input-box input:focus{

  border-color:#facc15;

  box-shadow:
  0 0 0 4px rgba(250,204,21,0.12);
}

.input-box input::placeholder{
  color:#94a3b8;
}

/* PASSWORD TOGGLE */

.eye-btn{
  position:absolute;
  right:14px;
  top:50%;
  transform:translateY(-50%);

  width:30px;
  height:30px;

  border-radius:50%;

  display:flex;
  justify-content:center;
  align-items:center;

  cursor:pointer;

  color:#cbd5e1;

  font-size:14px;

  transition:0.2s;
}

.eye-btn:hover{
  background:rgba(255,255,255,0.08);
}

/* OPTIONS */

.options{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:22px;
  font-size:13px;
  color:#cbd5e1;
}

.options a{
  color:#facc15;
  text-decoration:none;
}

.options input{
  accent-color:#facc15;
}

/* BUTTON */

.login-btn{
  width:100%;
  padding:15px;

  border:none;

  border-radius:15px;

  background:#facc15;

  color:#111827;

  font-size:18px;
  font-weight:bold;

  cursor:pointer;

  transition:0.3s;
}

.login-btn:hover{
  transform:translateY(-2px);

  box-shadow:
  0 10px 20px rgba(250,204,21,0.30);
}

/* SIGNUP */

.signup{
  text-align:center;
  margin-top:20px;
  color:#cbd5e1;
  font-size:14px;
}

.signup a{
  color:#facc15;
  text-decoration:none;
  font-weight:bold;
}

/* WHATSAPP */

.whatsapp{

  position:fixed;

  left:12px;
  bottom:16px;

  width:54px;
  height:54px;

  border-radius:50%;

  background:#25d366;

  color:white;

  display:flex;
  justify-content:center;
  align-items:center;

  text-decoration:none;

  font-size:26px;

  z-index:9999;

  cursor:grab;

  box-shadow:
  0 0 22px rgba(37,211,102,0.45);
}

/* FOOTER */

.footer{
  text-align:center;
  margin-top:22px;
  color:#94a3b8;
  font-size:13px;
}

/* MOBILE */

@media(max-width:500px){

  .container{
    max-width:100%;
  }

}

</style>

</head>

<body>

<div class="container">

  <!-- LOGO -->

  <div class="logo-section">

    <img
      src="logo.png"
      class="logo"
      alt="AMG Logo"
    >

    <div class="brand">
      AMG <span>DATA HUB</span>
    </div>

    <div class="tagline">
      Secure • Fast • Reliable
    </div>

  </div>

  <!-- SKIP CARD -->

  <div
    class="skip-card"
    onclick="window.location.href='shop.html'"
  >

    <div class="skip-left">

      <h2>Buy Without Login</h2>

      <p>
        Purchase data bundles instantly
        without creating an account.
      </p>

    </div>

    <div class="skip-arrow">
      →
    </div>

  </div>

  <!-- LOGIN CARD -->

  <div class="login-card">

    <h1>Welcome Back 👋</h1>

    <p class="sub">
      Login to continue managing your wallet,
      transactions and data purchases.
    </p>

    <!-- EMAIL -->

    <div class="input-box">

      <i class="fa-regular fa-envelope input-icon"></i>

      <input
        id="email"
        type="email"
        placeholder="Email Address"
      >

    </div>

    <!-- PASSWORD -->

    <div class="input-box">

      <i class="fa-solid fa-lock input-icon"></i>

      <input
        id="password"
        type="password"
        placeholder="Password"
      >

      <!-- REVEAL PASSWORD -->

      <div
        class="eye-btn"
        onclick="togglePassword()"
      >
        <i
          id="eyeIcon"
          class="fa-regular fa-eye"
        ></i>
      </div>

    </div>

    <!-- OPTIONS -->

    <div class="options">

      <label>
        <input type="checkbox">
        Remember me
      </label>

      <a href="#">
        Forgot Password?
      </a>

    </div>

    <!-- BUTTON -->

    <button
      class="login-btn"
      onclick="login()"
    >
      Sign In →
    </button>

    <!-- SIGNUP -->

    <div class="signup">

      Don’t have an account?

      <a href="signup.html">
        Create Account
      </a>

    </div>

  </div>

  <!-- FOOTER -->

  <div class="footer">
    © 2026 AMG Data Hub
  </div>

</div>

<!-- WHATSAPP -->

<a
  href="https://wa.me/233241895999"
  class="whatsapp"
  id="dragWhatsapp"
>
  <i class="fa-brands fa-whatsapp"></i>
</a>

<script>

/* PASSWORD TOGGLE */

function togglePassword(){

  const password =
    document.getElementById("password");

  const eyeIcon =
    document.getElementById("eyeIcon");

  if(password.type === "password"){

    password.type = "text";

    eyeIcon.classList.remove(
      "fa-eye"
    );

    eyeIcon.classList.add(
      "fa-eye-slash"
    );

  }else{

    password.type = "password";

    eyeIcon.classList.remove(
      "fa-eye-slash"
    );

    eyeIcon.classList.add(
      "fa-eye"
    );

  }

}

/* LOGIN */

function login(){

  window.location.href =
    "dashboard.html";

}

/* DRAG WHATSAPP */

const dragItem =
document.getElementById("dragWhatsapp");

let active = false;

let currentX;
let currentY;

let initialX;
let initialY;

dragItem.addEventListener(
  "touchstart",
  dragStart,
  false
);

dragItem.addEventListener(
  "touchmove",
  drag,
  false
);

dragItem.addEventListener(
  "touchend",
  dragEnd,
  false
);

function dragStart(e){

  initialX =
    e.touches[0].clientX -
    dragItem.offsetLeft;

  initialY =
    e.touches[0].clientY -
    dragItem.offsetTop;

  active = true;
}

function drag(e){

  if(active){

    e.preventDefault();

    currentX =
      e.touches[0].clientX -
      initialX;

    currentY =
      e.touches[0].clientY -
      initialY;

    dragItem.style.left =
      currentX + "px";

    dragItem.style.top =
      currentY + "px";

    dragItem.style.bottom =
      "auto";
  }

}

function dragEnd(){

  active = false;
}

</script>

</body>
</html>
