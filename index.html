<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
/>

<title>AMG Data Hub</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#020b3d;
  font-family:Arial, sans-serif;
  color:white;
  min-height:100vh;
  padding:20px;
}

.container{
  max-width:450px;
  margin:auto;
}

/* LOGO */

.logo-section{
  text-align:center;
  margin-top:40px;
  margin-bottom:30px;
}

.logo{
  width:140px;
  border-radius:30px;
  box-shadow:0 0 30px rgba(0,255,255,0.2);
}

.tagline{
  margin-top:20px;
  color:#b8c1ec;
  font-size:18px;
}

/* SKIP CARD */

.skip-card{
  background:#02192f;
  border:1px solid rgba(255,255,255,0.1);
  border-radius:25px;
  padding:25px;
  margin-bottom:30px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  box-shadow:0 0 30px rgba(0,255,255,0.1);
}

.skip-left h2{
  font-size:20px;
  margin-bottom:10px;
}

.skip-left p{
  color:#27e49b;
  font-size:15px;
}

.skip-arrow{
  font-size:40px;
  color:#27e49b;
}

/* LOGIN CARD */

.login-card{
  background:#111c55;
  border-radius:30px;
  padding:30px;
  border:1px solid rgba(255,255,255,0.08);
}

.login-card h1{
  font-size:45px;
  margin-bottom:10px;
}

.login-card .sub{
  color:#9ca3af;
  margin-bottom:30px;
}

/* INPUTS */

.input-box{
  margin-bottom:20px;
}

.input-box input{
  width:100%;
  padding:18px;
  border-radius:18px;
  border:2px solid rgba(255,255,255,0.15);
  background:transparent;
  color:white;
  font-size:16px;
  outline:none;
}

.input-box input::placeholder{
  color:#9ca3af;
}

/* OPTIONS */

.options{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:30px;
  font-size:15px;
}

.options a{
  color:#3b82f6;
  text-decoration:none;
}

/* BUTTON */

.login-btn{
  width:100%;
  padding:18px;
  border:none;
  border-radius:20px;
  background:#2f5bff;
  color:white;
  font-size:24px;
  font-weight:bold;
  cursor:pointer;
  box-shadow:0 0 30px rgba(47,91,255,0.5);
}

.login-btn:hover{
  opacity:0.9;
}

/* SIGNUP */

.signup{
  text-align:center;
  margin-top:30px;
  color:#9ca3af;
}

.signup a{
  color:#2f5bff;
  text-decoration:none;
  font-weight:bold;
}

/* WHATSAPP */

.whatsapp{
  position:fixed;
  right:20px;
  bottom:20px;
  width:70px;
  height:70px;
  background:#25d366;
  border-radius:50%;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:35px;
  text-decoration:none;
  box-shadow:0 0 40px rgba(37,211,102,0.5);
}

@media(max-width:500px){

  .login-card h1{
    font-size:38px;
  }

}

</style>

</head>

<body>

<div class="container">

  <!-- LOGO -->
  <div class="logo-section">

    <img
      src="logo.png"
      class="logo"
      alt="AMG Logo"
    >

    <p class="tagline">
      Secure • Fast • Reliable 
    </p>

  </div>

  <!-- SKIP LOGIN -->
  <div
    class="skip-card"
    onclick="window.location.href='shop.html'"
  >

    <div class="skip-left">
      <h2>Want to buy now?</h2>

      <p>
        Skip login and purchase directly
      </p>
    </div>

    <div class="skip-arrow">
      →
    </div>

  </div>

  <!-- LOGIN -->
  <div class="login-card">

    <h1>Welcome back 🤗</h1>

    <p class="sub">
      Sign in to your account
    </p>

    <div class="input-box">
      <input
        id="email"
        type="email"
        placeholder="Email"
      >
    </div>

    <div class="input-box">
      <input
        id="password"
        type="password"
        placeholder="Password"
      >
    </div>

    <div class="options">

      <label>
        <input type="checkbox">
        Remember me
      </label>

      <a href="#">
        Forgot password?
      </a>

    </div>

    <button
      class="login-btn"
      onclick="login()"
    >
      Sign In
    </button>

    <div class="signup">
      Don’t have an account?
      <a href="signup.html">
        Sign Up
      </a>
    </div>

  </div>

</div>

<!-- WHATSAPP -->
<a
  href="https://wa.me/233241895999"
  class="whatsapp"
>
  💬
</a>

<script type="module">

import { auth } from "./firebase.js";

import {
  signInWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

window.login = async function(){

  try{

    await signInWithEmailAndPassword(
      auth,
      email.value,
      password.value
    );

    window.location.href = "dashboard.html";

  }catch(error){

    alert(error.message);

  }

};

</script>

</body>
</html>
