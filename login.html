<!DOCTYPE html>
<html>
<head>
  <title>Login</title>
</head>
<body style="background:black;color:white;font-family:Arial;text-align:center;padding-top:100px;">

<h1>AMG DATA HUB LOGIN</h1>

<input id="email" type="email" placeholder="Email"><br><br>

<input id="password" type="password" placeholder="Password"><br><br>

<button onclick="login()">Login</button>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getAuth,
  signInWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDKzFFvvI1YpUQS0egOSOeeEsJ-3emvwng",
  authDomain: "amg-data-hub-fc194.firebaseapp.com",
  projectId: "amg-data-hub-fc194",
  storageBucket: "amg-data-hub-fc194.firebasestorage.app",
  messagingSenderId: "707108311634",
  appId: "1:707108311634:web:0ced751a70faaac46e458b",
  measurementId: "G-4DRMK6TZDW"
};

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

window.login = function(){

  const email =
  document.getElementById("email").value;

  const password =
  document.getElementById("password").value;

  signInWithEmailAndPassword(
    auth,
    email,
    password
  )

  .then(() => {

    window.location.href =
    "dashboard.html";

  })

  .catch((error) => {

    alert(error.message);

  });

}

</script>

</body>
</html>
