<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
/>

<title>AMG Data Hub</title>

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
/>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{

  font-family:Arial,sans-serif;

  min-height:100vh;

  display:flex;
  justify-content:center;
  align-items:center;

  overflow:hidden;

  position:relative;

  padding:20px;

  color:white;
}

/* BACKGROUND */

.bg-image{

  position:fixed;

  inset:0;

  width:100%;
  height:100%;

  object-fit:cover;

  z-index:-2;
}

.overlay{

  position:fixed;

  inset:0;

  background:
  rgba(0,0,0,0.65);

  z-index:-1;
}

/* CONTAINER */

.container{
  width:100%;
  max-width:430px;
}

/* LOGO */

.logo-section{
  text-align:center;
  margin-bottom:18px;
}

.logo{
  width:120px;
}

.tagline{
  margin-top:8px;
  color:#e5e7eb;
  font-size:15px;
}

/* SKIP CARD */

.skip-card{

  background:
  rgba(255,255,255,0.08);

  border:
  1px solid rgba(255,255,255,0.08);

  border-radius:24px;

  padding:20px;

  margin-bottom:22px;

  display:flex;
  justify-content:space-between;
  align-items:center;

  backdrop-filter:blur(10px);

  cursor:pointer;

  transition:0.3s;
}

.skip-card:hover{
  transform:translateY(-3px);
}

.skip-left h2{
  font-size:18px;
  margin-bottom:6px;
}

.skip-left p{
  color:#facc15;
  font-size:14px;
}

.skip-arrow{
  font-size:34px;
  color:#facc15;
}

/* LOGIN CARD */

.login-card{

  background:
  rgba(255,255,255,0.08);

  border:
  1px solid rgba(255,255,255,0.08);

  border-radius:30px;

  padding:24px;

  backdrop-filter:blur(12px);
}

.login-card h1{
  font-size:32px;
  margin-bottom:8px;
}

.sub{
  color:#d1d5db;
  margin-bottom:24px;
  font-size:15px;
}

/* INPUT */

.input-box{
  margin-bottom:18px;
  position:relative;
}

.input-box input{

  width:100%;

  padding:17px;

  border-radius:18px;

  border:
  1px solid rgba(255,255,255,0.1);

  background:
  rgba(255,255,255,0.06);

  color:white;

  outline:none;

  font-size:15px;
}

.input-box input::placeholder{
  color:#d1d5db;
}

/* PASSWORD TOGGLE */

.toggle-password{

  position:absolute;

  right:18px;
  top:50%;

  transform:translateY(-50%);

  cursor:pointer;

  color:#d1d5db;
}

/* OPTIONS */

.options{

  display:flex;
  justify-content:space-between;
  align-items:center;

  margin-bottom:24px;

  font-size:14px;
}

.options a{
  color:#facc15;
  text-decoration:none;
}

/* BUTTON */

.login-btn{

  width:100%;

  padding:17px;

  border:none;

  border-radius:20px;

  background:#facc15;

  color:#000b2c;

  font-size:18px;

  font-weight:bold;

  cursor:pointer;

  transition:0.3s;
}

.login-btn:hover{
  opacity:0.9;
}

/* SIGNUP */

.signup{
  text-align:center;
  margin-top:24px;
  color:#d1d5db;
}

.signup a{
  color:#facc15;
  text-decoration:none;
  font-weight:bold;
}

/* WHATSAPP */

.whatsapp{

  position:fixed;

  left:12px;
  bottom:18px;

  width:55px;
  height:55px;

  border-radius:50%;

  background:#25d366;

  color:white;

  display:flex;
  justify-content:center;
  align-items:center;

  font-size:26px;

  text-decoration:none;

  z-index:9999;

  cursor:grab;

  box-shadow:
  0 0 20px rgba(37,211,102,0.5);
}

/* MOBILE */

@media(max-width:500px){

  .login-card h1{
    font-size:28px;
  }

}

</style>

</head>

<body>

<!-- BACKGROUND -->

<img
src="background.jpg"
class="bg-image"
>

<div class="overlay"></div>

<div class="container">

<!-- LOGO -->

<div class="logo-section">

<img
src="logo.png"
class="logo"
alt="AMG Logo"
>

<p class="tagline">
Secure • Fast • Reliable
</p>

</div>

<!-- SKIP -->

<div
class="skip-card"
onclick="window.location.href='shop.html'"
>

<div class="skip-left">

<h2>
Want to buy now?
</h2>

<p>
Skip login and purchase directly
</p>

</div>

<div class="skip-arrow">
→
</div>

</div>

<!-- LOGIN -->

<div class="login-card">

<h1>
Welcome back 👋
</h1>

<p class="sub">
Sign in to continue
</p>

<div class="input-box">

<input
id="email"
type="email"
placeholder="Enter Email"
>

</div>

<div class="input-box">

<input
id="password"
type="password"
placeholder="Enter Password"
>

<span
class="toggle-password"
onclick="togglePassword()"
>

<i
class="fa-solid fa-eye"
id="eyeIcon"
></i>

</span>

</div>

<div class="options">

<label>

<input type="checkbox">

 Remember me

</label>

<a href="#">
Forgot Password?
</a>

</div>

<button
class="login-btn"
onclick="goDashboard()"
>
Sign In
</button>

<div class="signup">

Don’t have an account?

<a href="signup.html">
Sign Up
</a>

</div>

</div>

</div>

<!-- WHATSAPP -->

<a
href="https://wa.me/233241895999"
class="whatsapp"
id="dragWhatsapp"
>

<i class="fa-brands fa-whatsapp"></i>

</a>

<script>

/* PASSWORD TOGGLE */

function togglePassword(){

const password =
document.getElementById(
"password"
);

const eyeIcon =
document.getElementById(
"eyeIcon"
);

if(password.type === "password"){

password.type = "text";

eyeIcon.classList.remove(
"fa-eye"
);

eyeIcon.classList.add(
"fa-eye-slash"
);

}else{

password.type = "password";

eyeIcon.classList.remove(
"fa-eye-slash"
);

eyeIcon.classList.add(
"fa-eye"
);

}

}

/* LOGIN */

function goDashboard(){

const userData = {

fullName : "AMG User",

email :
document.getElementById(
"email"
).value || "user@gmail.com",

phone : "0240000000",

registrationDate :
new Date().toLocaleDateString(),

activeDays : 1

};

localStorage.setItem(
"amgUser",
JSON.stringify(userData)
);

/* ALWAYS OPEN DASHBOARD PAGE */

localStorage.setItem(
"activePage",
"dashboardPage"
);

window.location.href =
"dashboard.html";

}

/* DRAG WHATSAPP */

const dragItem =
document.getElementById(
"dragWhatsapp"
);

let active = false;

let currentX;
let currentY;

let initialX;
let initialY;

dragItem.addEventListener(
"touchstart",
dragStart,
false
);

dragItem.addEventListener(
"touchmove",
drag,
false
);

dragItem.addEventListener(
"touchend",
dragEnd,
false
);

function dragStart(e){

initialX =
e.touches[0].clientX -
dragItem.offsetLeft;

initialY =
e.touches[0].clientY -
dragItem.offsetTop;

active = true;
}

function drag(e){

if(active){

e.preventDefault();

currentX =
e.touches[0].clientX -
initialX;

currentY =
e.touches[0].clientY -
initialY;

dragItem.style.left =
currentX + "px";

dragItem.style.top =
currentY + "px";

dragItem.style.bottom =
"auto";

}

}

function dragEnd(){
active = false;
}

</script>

</body>
</html>
