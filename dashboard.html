<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMG Data Hub Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        :root {
            --primary: #facc15;
            --bg: #000b2c;
            --card: rgba(255,255,255,0.04);
            --border: rgba(255,255,255,0.08);
        }

        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: var(--bg);
            color: white;
            font-family: 'Segoe UI', Arial, sans-serif;
            padding: 18px;
            overflow-x: hidden;
        }
        body.dark { background: #050505; }

        /* Previous styles (side menu, header, modals, cards, etc.) remain the same */
        /* I'll keep only the new/important styles here for brevity */

        .bundle-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 14px;
            margin-top: 20px;
        }

        .bundle-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 22px;
            padding: 18px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .bundle-card:hover {
            transform: translateY(-8px);
            border-color: var(--primary);
            box-shadow: 0 10px 20px rgba(250, 204, 21, 0.15);
        }

        .bundle-card.active {
            border-color: var(--primary);
            background: rgba(250, 204, 21, 0.1);
        }

        .data-amount {
            font-size: 28px;
            font-weight: bold;
            color: var(--primary);
        }

        .data-validity {
            color: #9ca3af;
            font-size: 14px;
            margin: 8px 0;
        }

        .bundle-price {
            font-size: 22px;
            font-weight: bold;
            margin: 12px 0;
        }

        .buy-btn {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: #000b2c;
            border: none;
            border-radius: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .section-title {
            font-size: 22px;
            margin: 25px 0 15px;
        }

        .input-field {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 18px;
            background: rgba(255,255,255,0.08);
            color: white;
            margin-bottom: 15px;
            font-size: 16px;
        }

        .big-btn {
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: 18px;
            background: var(--primary);
            color: #000b2c;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Side Menu, Overlay, Profile Modal (same as before) -->
    <!-- ... [Keep your existing side menu and modals] ... -->

    <!-- DASHBOARD PAGE (unchanged) -->
    <div class="page active" id="dashboardPage">
        <!-- Your existing dashboard content -->
    </div>

    <!-- ==================== MTN DATA PAGE ==================== -->
    <div class="page" id="mtnPage">
        <div class="simple-header">
            <button class="back-btn" onclick="showPage('dashboardPage')">←</button>
            <h2>MTN Data Bundles</h2>
        </div>

        <div class="card">
            <h3 class="section-title">Choose MTN Data Bundle</h3>
            <div class="bundle-grid" id="mtnBundles"></div>

            <div style="margin-top: 30px;">
                <input type="tel" id="mtnPhone" class="input-field" placeholder="Enter Phone Number (e.g. 0551234567)" maxlength="10">
                <button class="big-btn" onclick="confirmPurchase('MTN')">Proceed to Buy</button>
            </div>
        </div>
    </div>

    <!-- ==================== AIRTELTIGO DATA PAGE ==================== -->
    <div class="page" id="airtelPage">
        <div class="simple-header">
            <button class="back-btn" onclick="showPage('dashboardPage')">←</button>
            <h2>AirtelTigo Data Bundles</h2>
        </div>

        <div class="card">
            <h3 class="section-title">Choose AirtelTigo Bundle</h3>
            <div class="bundle-grid" id="airtelBundles"></div>

            <div style="margin-top: 30px;">
                <input type="tel" id="airtelPhone" class="input-field" placeholder="Enter Phone Number" maxlength="10">
                <button class="big-btn" onclick="confirmPurchase('AirtelTigo')">Proceed to Buy</button>
            </div>
        </div>
    </div>

    <!-- ==================== TELECEL DATA PAGE ==================== -->
    <div class="page" id="telecelPage">
        <div class="simple-header">
            <button class="back-btn" onclick="showPage('dashboardPage')">←</button>
            <h2>Telecel Data Bundles</h2>
        </div>

        <div class="card">
            <h3 class="section-title">Choose Telecel Bundle</h3>
            <div class="bundle-grid" id="telecelBundles"></div>

            <div style="margin-top: 30px;">
                <input type="tel" id="telecelPhone" class="input-field" placeholder="Enter Phone Number" maxlength="10">
                <button class="big-btn" onclick="confirmPurchase('Telecel')">Proceed to Buy</button>
            </div>
        </div>
    </div>

    <!-- Other pages (wallet, deposit, history, results) remain the same -->

    <!-- WHATSAPP BUTTON -->
    <a href="https://wa.me/233241895999" class="whatsapp" id="dragWhatsapp">
        <i class="fa-brands fa-whatsapp"></i>
    </a>

    <script>
        // ==================== USER DATA (Keep your existing user code) ====================
        const currentUser = JSON.parse(localStorage.getItem("amgUser")) || {
            fullName: "Guest User", email: "guest@gmail.com", phone: "0240000000"
        };

        // Populate user info (keep your existing code here)

        // ==================== BUNDLE DATA ====================
        const bundles = {
            mtn: [
                { id: 1, data: "1.5 GB", validity: "1 Day", price: 5, type: "Daily" },
                { id: 2, data: "5 GB", validity: "7 Days", price: 20, type: "Weekly" },
                { id: 3, data: "12 GB", validity: "30 Days", price: 50, type: "Monthly" },
                { id: 4, data: "25 GB", validity: "30 Days", price: 80, type: "Monthly" },
                { id: 5, data: "50 GB", validity: "30 Days", price: 150, type: "Monthly" }
            ],
            airtel: [
                { id: 1, data: "2 GB", validity: "3 Days", price: 8, type: "Daily" },
                { id: 2, data: "6 GB", validity: "7 Days", price: 25, type: "Weekly" },
                { id: 3, data: "15 GB", validity: "30 Days", price: 55, type: "Monthly" },
                { id: 4, data: "30 GB", validity: "30 Days", price: 95, type: "Monthly" }
            ],
            telecel: [
                { id: 1, data: "1 GB", validity: "1 Day", price: 4, type: "Daily" },
                { id: 2, data: "4 GB", validity: "7 Days", price: 18, type: "Weekly" },
                { id: 3, data: "10 GB", validity: "30 Days", price: 45, type: "Monthly" },
                { id: 4, data: "20 GB", validity: "30 Days", price: 75, type: "Monthly" }
            ]
        };

        // Render Bundles
        function renderBundles(network, containerId) {
            const container = document.getElementById(containerId);
            container.innerHTML = "";

            bundles[network].forEach(bundle => {
                const div = document.createElement("div");
                div.className = "bundle-card";
                div.innerHTML = `
                    <div class="data-amount">${bundle.data}</div>
                    <div class="data-validity">${bundle.validity}</div>
                    <div class="bundle-price">GH₵ ${bundle.price}</div>
                    <small style="color:#94a3b8;">${bundle.type}</small>
                    <button class="buy-btn" onclick="selectBundle(this, ${bundle.price}, '${bundle.data}', '${network}')">
                        Buy Now
                    </button>
                `;
                container.appendChild(div);
            });
        }

        let selectedBundle = null;

        function selectBundle(element, price, data, network) {
            // Remove active class from all
            document.querySelectorAll('.bundle-card').forEach(card => card.classList.remove('active'));
            // Add active to clicked
            element.closest('.bundle-card').classList.add('active');
            
            selectedBundle = { price, data, network };
        }

        function confirmPurchase(network) {
            const phoneInput = document.getElementById(network.toLowerCase() + "Phone");
            const phone = phoneInput.value.trim();

            if (!selectedBundle) {
                alert("Please select a data bundle first!");
                return;
            }
            if (!phone || phone.length < 10) {
                alert("Please enter a valid phone number!");
                return;
            }

            const confirmMsg = `Confirm Purchase?\n\nNetwork: ${network}\nData: ${selectedBundle.data}\nAmount: GH₵ ${selectedBundle.price}\nPhone: ${phone}\n\nClick OK to proceed.`;

            if (confirm(confirmMsg)) {
                alert(`✅ Purchase Successful!\n\n${selectedBundle.data} has been sent to ${phone}\n\nThank you for using AMG Data Hub!`);
                
                // Reset after purchase
                selectedBundle = null;
                phoneInput.value = "";
                document.querySelectorAll('.bundle-card').forEach(card => card.classList.remove('active'));
            }
        }

        // Initialize pages when loaded
        window.onload = function() {
            // Render all bundles
            renderBundles('mtn', 'mtnBundles');
            renderBundles('airtel', 'airtelBundles');
            renderBundles('telecel', 'telecelBundles');

            // Restore last active page (your existing code)
            const savedPage = localStorage.getItem("activePage");
            if (savedPage) showPage(savedPage);
        };

        // Keep all your existing functions: openMenu, closeMenu, showPage, openProfile, etc.
        // ... (paste your existing script functions here)
    </script>
</body>
</html>
